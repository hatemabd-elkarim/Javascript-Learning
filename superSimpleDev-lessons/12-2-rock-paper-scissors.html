<!doctype html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="12-2-rock-paper-scissors.css" class="css" />
  </head>
  <!-- in this lesson, we refactor the code by arrow functions and event listeners, we also add the functionality to play with keys -->
  <body>
    <p class="title">Rock Paper Scissors</p>
    <button class="move-button js-rock-button">
      <img src="images/rock-emoji.png" class="move-icon" />
    </button>

    <button class="move-button js-paper-button">
      <img src="images/paper-emoji.png" class="move-icon" />
    </button>

    <button class="move-button js-scissors-button">
      <img src="images/scissors-emoji.png" class="move-icon" />
    </button>

    <p class="js-result result"></p>
    <p class="js-moves moves"></p>
    <p class="js-score score"></p>

    <button onclick="resetScore()" class="reset-score-button">
      Reset Score
    </button>
    <button onclick="autoPlay()" class="auto-play-button">Auto Play</button>
    <script src="12-2-rock-paper-scissors.js"></script>
    <!-- always move the script to the end to load the layout first -->
  </body>
</html>
