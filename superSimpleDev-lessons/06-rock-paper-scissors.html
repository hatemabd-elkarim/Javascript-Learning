<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
  </head>

  <!-- in this lesson, i used blocks to ignore the error of redclaring variables,
  also this is a simple version of the game, later we will use a function to
  refactor it and avoid code redundancy -->
  <body>
    <p>Rock Paper Scissors</p>
    <!-- ROCK -->
    <button
      onclick="
        {
          const rand = Math.random();
          let compMove = '';

          if (rand < 1 / 3) {
            compMove = 'rock';
          } else if (rand < 2 / 3) {
            compMove = 'paper';
          } else {
            compMove = 'scissors';
          }

          let res = '';

          if (compMove === 'rock') {
            res = 'Tie';
          } else if (compMove === 'paper') {
            res = 'You Lose';
          } else {
            res = 'You Win';
          }

          alert(`You picked rock, computer picked ${compMove}, ${res}`);
        }
      "
    >
      Rock
    </button>

    <!-- PAPER -->
    <button
      onclick="
        {
          const rand = Math.random();
          let compMove = '';

          if (rand < 1 / 3) {
            compMove = 'rock';
          } else if (rand < 2 / 3) {
            compMove = 'paper';
          } else {
            compMove = 'scissors';
          }

          let res = '';

          if (compMove === 'rock') {
            res = 'You Win';
          } else if (compMove === 'paper') {
            res = 'Tie';
          } else {
            res = 'You Lose';
          }

          alert(`You picked paper, computer picked ${compMove}, ${res}`);
        }
      "
    >
      Paper
    </button>

    <!-- SCISSORS -->
    <button
      onclick="
        {
          const rand = Math.random();
          let compMove = '';

          if (rand < 1 / 3) {
            compMove = 'rock';
          } else if (rand < 2 / 3) {
            compMove = 'paper';
          } else {
            compMove = 'scissors';
          }

          let res = '';

          if (compMove === 'rock') {
            res = 'You Lose';
          } else if (compMove === 'paper') {
            res = 'You Win';
          } else {
            res = 'Tie';
          }
          alert(`You picked scissors, computer picked ${compMove}, ${res}`);
        }
      "
    >
      Scissors
    </button>
  </body>
</html>
