<!doctype html>
<html>
  <head>
    <title>To do list</title>
    <link rel="stylesheet" href="12-2-to-do-list.css" class="css" />
  </head>
  <!-- in this lesson, we refactor the code by arrow functions and event listeners, we also add the functionality to press enter to add todo -->
