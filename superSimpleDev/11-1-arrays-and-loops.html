<!doctype html>
<html>
  <head>
    <title>Arrays and loops</title>
    <style></style>
  </head>
  <body>
    <script>
      // arrays
      const myArray = [10, 20, 30];
      console.log(myArray);
      console.log(myArray[0]);

      myArray[0] = 99;
      console.log(myArray);

      [
        1,
        "hello",
        {
          name: "socks",
        },
        [1, 2],
      ];

      console.log(typeof [1, 2]); // object
      console.log(Array.isArray([1, 2]));

      console.log(myArray.length);

      myArray.push(100); // add 100 to the end
      console.log(myArray);

      const removed = myArray.splice(0, 2); // from index 0, remove 2 elements starting
      console.log(removed);

      // loops
      let i = 1;
      while (i <= 5) {
        console.log(i++);
      }

      for (let i = 1; i <= 5; i++) {
        console.log(i);
      }

      // looping through an array
      const todoList = ["make dinner", "wash dishes", "watch youtube"];

      for (let i = 0; i < todoList.length; i++) {
        const value = todoList[i];
        console.log(value);
      }

      // accumulate pattern
      const nums = [1, 1, 3];
      let sum = 0;

      for (let i = 0; i < nums.length; i++) {
        const num = nums[i];
        sum += num;
      }
      console.log(sum);

      const numsDoubled = [];
      for (let i = 0; i < nums.length; i++) {
        const num = nums[i];
        numsDoubled.push(num * 2);
      }
      console.log(numsDoubled);
    </script>
  </body>
</html>
