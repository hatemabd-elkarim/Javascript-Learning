<!doctype html>
<html>
  <head>
    <title>DOM</title>
  </head>
  <body>
    <button>Hello</button>
    <button class="js-button">Hi</button>
    <script>
      console.log(document.title);
      //   document.title = 'good job';

      console.log(typeof document.body); // object
      //   document.body.innerHTML = 'hello';

      console.log(document.body.innerHTML);

      console.log(document.querySelector("button").innerHTML); // select the first button => hello

      // html elements are js objects
      document.querySelector("button").innerHTML = "changed";

      console.log(document.querySelector(".js-button")); // the . operator is a class selector

      // extra
      console.log("25" - 5); // coersion for string
      console.log("25" + 5); // text concat, coersion for numebr

      window.document;
      window.console.log("hello");
      window.alert("hello");
    </script>
  </body>
</html>
